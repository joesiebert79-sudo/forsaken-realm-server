name: Publish Render Android app
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-render-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the signed Render APK
        run: |
          curl --fail --location --retry 5 --retry-delay 5 --output Forsaken-Realm-Render-v0.96.7.apk https://forsaken-realm-server.onrender.com/android/Forsaken-Realm-Render-v0.96.7.apk
          echo "06e835ce02500cfc0f5a1d4968d25990a63f79d883c5e6cae3cb3f2ac99a64  Forsaken-Realm-Render-v0.96.7.apk" | sha256sum --check
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.96.7-render Forsaken-Realm-Render-v0.96.7.apk --repo "$GITHUB_REPOSITORY" --title "Forsaken Realm Render v0.96.7" --notes "Separate Android app for the Render server. Install once alongside the original app."
