name: Issue 2 Android visual review
on:
  push:
    branches: [issue-2-approved-world-review]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual Forsaken Realm screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash scripts/issue-2-capture.sh
      - name: Upload screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-2-actual-android-screens
          path: ${{ runner.temp }}/issue-2-capture/screenshots/*.png
          if-no-files-found: warn
      - name: Save real screenshots on review branch
        if: success()
        run: |
          mkdir -p docs/issue-2-screenshots
          for scene in map village trader wilderness house; do
            cp "$RUNNER_TEMP/issue-2-capture/screenshots/$scene.png" docs/issue-2-screenshots/
          done
          git add docs/issue-2-screenshots
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add actual Android world review screenshots'
            git push origin HEAD:issue-2-approved-world-review
          fi
